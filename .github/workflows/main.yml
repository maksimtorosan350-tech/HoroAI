name: Build HoroAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Extract Android project
        run: |
          mkdir -p _source

          ZIP_FILE="$GITHUB_WORKSPACE/HoroAI-Private-LocalAI-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d _source

          PROJECT_DIR=$(find _source -type f \
            -path '*/app/build.gradle.kts' \
            -print -quit | sed 's#/app/build.gradle.kts##')

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Remove biometric login
        run: |
          SOURCE="$GITHUB_WORKSPACE/MainActivity.kt"
          TARGET="$PROJECT_DIR/app/src/main/java/ai/horoai/app/MainActivity.kt"
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Correct MainActivity.kt not found"
            exit 1
          fi

          if grep -Eq 'BiometricPrompt|authenticate\(' "$SOURCE"; then
            echo "ERROR: Source file still contains biometric login"
            exit 1
          fi

          cp "$SOURCE" "$TARGET"

          sed -i '/androidx.biometric:biometric/d' "$GRADLE_FILE"

          if grep -Eq 'BiometricPrompt|authenticate\(' "$TARGET"; then
            echo "ERROR: Biometric code remains"
            exit 1
          fi

          echo "SUCCESS: Biometric login removed"

      - name: Build llama.cpp
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/cpp"

          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            "$PROJECT_DIR/app/src/main/cpp/llama.cpp"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HoroAI-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
